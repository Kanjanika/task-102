<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>งานห้อง 102</title>
<script src="msal-browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf6e3;--panel:#fff;--panel-2:#fff8e7;--line:#ece3cc;
    --ink:#4a4636;--muted:#9a9279;--accent:#f6c453;--accent-ink:#4a3c10;
    --blue:#7fbce8;--blue-deep:#5a9fd4;--green:#7cc4a0;--red:#e88b8b;
    --violet:#b3a0e0;--slate:#bcae8e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",sans-serif;min-height:100vh}
  h1,h2,h3{font-family:"Sora",sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:14px 20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .brand h1{font-size:17px;margin:0}
  .topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .link{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;
    padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .link:hover{color:var(--ink)}
  .btn{border:none;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-ms{background:#0072c6;color:#fff;display:inline-flex;align-items:center;gap:7px}
  .btn-ms:hover{background:#005ea8}
  #sp-status-text{font-size:12px;color:var(--muted)}
  #sp-user-text{font-size:11px;color:var(--blue-deep)}

  .tabs{display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:5px;width:fit-content;margin-bottom:16px;flex-wrap:wrap}
  .tab{background:none;border:none;color:var(--muted);padding:8px 14px;border-radius:10px;
    cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
  .tab.active{background:var(--accent);color:var(--accent-ink)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat .n{font-size:28px;font-weight:700;font-family:"Sora"}
  .stat .l{color:var(--muted);font-size:12px;margin-top:2px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .panel h3{margin:0 0 12px;font-size:14px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;
    letter-spacing:.04em;padding:7px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
  .pill-todo{background:#efe9d8;color:#857c61}.pill-doing{background:#dcecf9;color:var(--blue-deep)}
  .pill-hold{background:#ece3fa;color:#8268c2}.pill-done{background:#d8f0e3;color:#4d9b76}
  .pill-pre{background:#fdeec6;color:#a8841f}.pill-post{background:#d6e9f8;color:#3f7cae}
  .pill-other{background:#e9e2d4;color:#8a8064}
  .due-over{color:var(--red);font-weight:600}
  .assignees{display:inline-flex}
  .mini-av{width:22px;height:22px;border-radius:50%;background:var(--slate);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:10px;
    border:2px solid var(--panel);margin-left:-5px}
  .mini-av:first-child{margin-left:0}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .bar-row .name{width:110px;font-size:12px}
  .bar-track{flex:1;background:var(--panel-2);height:9px;border-radius:5px;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent)}
  .bar-row .val{width:80px;text-align:right;color:var(--muted);font-size:11px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .filters input,.filters select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;color:var(--ink);font-size:12px;font-family:inherit}
  .filters input{flex:1;min-width:140px}
  .cal-grid{display:flex;flex-direction:column;gap:16px}
  .cal-title{font-family:"Sora";font-size:15px;margin:0 0 10px;text-align:center}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:10px;color:var(--muted);margin-bottom:3px}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-cell{min-height:80px;border:1px solid var(--line);border-radius:7px;padding:4px;background:var(--panel-2);overflow:hidden}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .cal-date{font-size:11px;color:var(--muted)}
  .cal-cell.today .cal-date{color:var(--accent);font-weight:700}
  .cal-ev{font-size:10px;line-height:1.3;border-radius:4px;padding:2px 5px;margin-top:2px;
    background:var(--blue);color:#fff;white-space:normal;word-break:break-word;cursor:pointer;transition:filter .12s}
  .cal-ev:hover{filter:brightness(.9)}.cal-ev.over{background:var(--red)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:470px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 14px;font-size:17px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input,.field select{width:100%;background:var(--panel-2);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;color:var(--ink);font-size:13px;font-family:inherit}
  .modal-actions{display:flex;gap:8px;margin-top:6px}
  .empty{text-align:center;color:var(--muted);padding:24px;font-size:13px}
  .hidden{display:none!important}
  @media print{
    @page{margin:12mm}
    body{background:#fff!important}
    .topbar-right,.tabs,.filters,.toolbar .btn,[onclick*="calShift"]{display:none!important}
    #tasksTab>.panel:first-child,#projectsTab>.panel:first-child,#dashboardTab>.panel:first-child{display:none!important}
    .panel,.stat,.topbar{box-shadow:none!important;border:1px solid #ddd!important;break-inside:avoid}
    .wrap{max-width:100%!important;padding:0!important}
    td:last-child,th:last-child{display:none!important}
    .bar-fill,.pill,.cal-cell,.cal-ev{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .pill{border:1px solid #ccc}
    #printHeading{display:block!important}
  }
  #printHeading{display:none}
  @media(max-width:720px){
    .stats{grid-template-columns:repeat(2,1fr)}
    table{font-size:12px}
    th:nth-child(2),td:nth-child(2){display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">🏗️</div>
      <div>
        <h1>งานห้อง 102</h1>
        <div style="font-size:11px;color:var(--muted)">
          <span id="sp-status-text">⚪ ยังไม่ได้ Login</span>
          <span id="sp-user-text" style="margin-left:6px"></span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <!-- ปุ่ม login เหมือน it-tasks — แสดงตลอด กดได้ทันที -->
      <button class="btn btn-ms" id="btn-login" onclick="ensureAuth().then(function(){loadTasks();})">
        🔐 Login Microsoft

      <button class="link" id="btn-logout" onclick="doLogout()" style="display:none">ออกจากระบบ</button>
      <button class="link" id="btn-refresh" onclick="loadTasks()" style="display:none">⟳ โหลดใหม่</button>
      <button class="link" onclick="window.print()">🖨️ พิมพ์</button>
    </div>
  </div>

  <div id="printHeading" style="margin-bottom:12px">
    <h2 style="margin:0;font-size:18px">งานห้อง 102 — <span id="printViewName">Dashboard</span></h2>
    <div style="color:#666;font-size:12px" id="printDate"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</button>
    <button class="tab" data-tab="tasks" onclick="switchTab('tasks')">งานทั้งหมด</button>

    <button class="tab" data-tab="calendar" onclick="switchTab('calendar')">ปฏิทิน</button>
  </div>

  <div id="dashboardTab">
    <div class="panel" style="padding:12px;margin-bottom:14px">
      <div class="filters">
        <span style="font-size:12px;color:var(--muted)">ช่วงเวลา:</span>
        <select id="dashYear" onchange="renderDashboard()"><option value="">ทุกปี</option></select>
        <select id="dashMonth" onchange="renderDashboard()">

          <option value="0">มกราคม</option><option value="1">กุมภาพันธ์</option><option value="2">มีนาคม</option>
          <option value="3">เมษายน</option><option value="4">พฤษภาคม</option><option value="5">มิถุนายน</option>
          <option value="6">กรกฎาคม</option><option value="7">สิงหาคม</option><option value="8">กันยายน</option>
          <option value="9">ตุลาคม</option><option value="10">พฤศจิกายน</option><option value="11">ธันวาคม</option>
        </select>
        <button class="link" onclick="clearDashFilter()">ล้าง</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="sTotal">0</div><div class="l">งานทั้งหมด</div></div>
      <div class="stat"><div class="n" id="sDoing" style="color:var(--blue-deep)">0</div><div class="l">กำลังทำ</div></div>
      <div class="stat"><div class="n" id="sHold" style="color:#8268c2">0</div><div class="l">พักไว้</div></div>
      <div class="stat"><div class="n" id="sOver" style="color:var(--red)">0</div><div class="l">เลยกำหนด</div></div>
    </div>
    <div class="panel"><h3 id="nextMonthTitle">งานที่ต้องส่งเดือนหน้า</h3><div id="nextMonth"></div></div>
    <div class="panel"><h3>ภาระงานต่อคน</h3><div id="workload"></div></div>
    <div class="panel"><h3>ระยะเวลาทำงานเฉลี่ยตามประเภทงาน (วัน)</h3><div id="durationByType"></div></div>
  </div>

  <div id="tasksTab" class="hidden">
    <div class="panel" style="padding:12px">
      <div class="filters">
        <input id="filterSearch" placeholder="🔍 ค้นหาชื่องาน…" oninput="renderTaskTable()"/>
        <select id="filterProject" onchange="renderTaskTable()"><option value="">ทุกโครงการ</option></select>
        <select id="filterPhase" onchange="renderTaskTable()">
          <option value="">ทุกเฟส</option><option>Pre-Construction</option><option>Post-Construction</option><option>อื่นๆ</option>
        </select>
        <select id="filterType" onchange="renderTaskTable()"><option value="">ทุกประเภท</option></select>
        <select id="filterStatus" onchange="renderTaskTable()">
          <option value="">ทุกสถานะ</option><option value="todo">ยังไม่เริ่ม</option><option value="doing">กำลังทำ</option>
          <option value="hold">พักไว้</option><option value="done">เสร็จแล้ว</option>
        </select>
        <select id="filterAssignee" onchange="renderTaskTable()"><option value="">ทุกคน</option></select>
        <button class="link" onclick="clearFilters()">ล้างตัวกรอง</button>

    <div class="toolbar">

      </tr></thead><tbody id="taskBody"></tbody></table>
      <div id="noTasks" class="empty hidden"></div>
    </div>
  </div>

  <div id="projectsTab" class="hidden">
    <div class="panel" style="padding:12px">
      <div class="filters">
        <input id="pFilterSearch" placeholder="🔍 ค้นหาชื่องาน…" oninput="renderProjects()"/>
        <select id="pFilterPhase" onchange="renderProjects()">
          <option value="">ทุกเฟส</option><option>Pre-Construction</option><option>Post-Construction</option><option>อื่นๆ</option>
        </select>
        <select id="pFilterType" onchange="renderProjects()"><option value="">ทุกประเภท</option></select>
        <select id="pFilterStatus" onchange="renderProjects()">
          <option value="">ทุกสถานะ</option><option value="todo">ยังไม่เริ่ม</option><option value="doing">กำลังทำ</option>
          <option value="hold">พักไว้</option><option value="done">เสร็จแล้ว</option>
        </select>
        <select id="pFilterAssignee" onchange="renderProjects()"><option value="">ทุกคน</option></select>
        <button class="link" onclick="clearProjectFilters()">ล้างตัวกรอง</button>
      </div>
    </div>
    <div id="projectGroups"></div>
  </div>

  <div id="calendarTab" class="hidden">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <button class="link" onclick="calShift(-1)">‹ ก่อนหน้า</button>
      <button class="link" onclick="calShift(1)">ถัดไป ›</button>
      <span style="color:var(--muted);font-size:12px">📋 คลิกที่งานเพื่อแก้ไข</span>
    </div>
    <div class="cal-grid"><div class="panel" id="calMonth0"></div><div class="panel" id="calMonth1"></div></div>
  </div>
</div>

<div id="taskOverlay" class="overlay">
  <div class="modal">
    <h3 id="modalTitle">เพิ่มงาน</h3>
    <input type="hidden" id="editId"/>
    <div class="field"><label>ชื่องาน *</label><input id="fTitle"/></div>
    <div class="field"><label>โครงการ</label><input id="fProject"/></div>
    <div class="field"><label>เฟส</label>

    </div>
    <div class="field"><label>ประเภทงาน</label>

        <option>Tender</option>
        <option>ประชุม Weekly Meeting</option>
        <option>Progress Payment</option>
        <option>Payment Certificate</option>
        <option>VO</option>
        <option>VE</option>

        <option value="cos_meen">meen</option>
        <option value="cos_friend">friend</option>
        <option value="cos_auto">auto</option>
        <option value="cos_nan">nan</option>

      <textarea id="fRemark" rows="2" style="width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink);font-size:13px;font-family:inherit;resize:vertical" placeholder="หมายเหตุเพิ่มเติม"></textarea>

    <div class="field"><label>สถานะ</label>
      <select id="fStatus"><option value="todo">ยังไม่เริ่ม</option><option value="doing">กำลังทำ</option>

      <button class="btn link" onclick="closeTaskModal()">ยกเลิก</button>
      <button class="btn link" id="delBtn" onclick="deleteTask()" style="display:none;color:var(--red)">ลบ</button>
    </div>
    <p id="saveError" style="color:var(--red);font-size:12px;margin:8px 0 0"></p>
  </div>
</div>

<script>
/* งานห้อง 102 — MSAL pattern เหมือน it-tasks ที่ใช้งานได้จริง */
var SP_CONFIG = {
  clientId: '6f9d246c-24fb-4bfd-a59c-6dcea28459a6',
  tenantId: '33021451-82a3-41cd-b43e-baf144e67483',
  siteId:   'costplan1.sharepoint.com,35c954da-661a-413f-8f9c-06cd07fef98c,21fac326-5c53-470c-b37b-e8b62487eb98',
  listId:   '7f6cc70a-636a-4c88-a55a-5b64897f34ae',
};
var SCOPES = ['https://graph.microsoft.com/Sites.ReadWrite.All'];
var SP_MAP = {
  title:'Title',project:'Project',phase:'Phase',type:'TaskType',status:'Status',
  received:'DateReceived',started:'DateStarted',completed:'DateCompleted',due:'DueDate',
  assignees:'AssigneesLoolupId',remark:'Remark'
};
var STATUS_MAP = {
  todo:{label:"ยังไม่เริ่ม",cls:"pill-todo"},doing:{label:"กำลังทำ",cls:"pill-doing"},
  hold:{label:"พักไว้",cls:"pill-hold"},done:{label:"เสร็จแล้ว",cls:"pill-done"}
};

/* ---- User mapping ชื่อเล่น → email ---- */
var USER_MAP = {
  'cos_meen':   'siret@costplan.co.th',
  'cos_friend': 'sorawit@costplan.co.th',
  'cos_auto':   'nuttawut@costplan.co.th',
  'cos_nan':    'chawannuch@costplan.co.th',
  'cos_noon':   'kanjanika@costplan.co.th',
};
var userIdCache = {}; // email → SP user ID (number)

async function resolveUserId(email) {
  if (userIdCache[email]) return userIdCache[email];
  try {
    // ใช้ SP REST ensureUser เพื่อได้ user ID ใน site
    var res = await graphFetch(
      '/sites/' + SP_CONFIG.siteId + '/_api/web/ensureUser(\'' + email + '\')',
      'POST', {}
    );
    // ensureUser คืน OData ที่มี Id
    if (res && res.Id) { userIdCache[email] = res.Id; return res.Id; }
  } catch(e) { console.warn('ensureUser failed for', email, e.message); }
  // fallback: ลอง Graph users
  try {
    var u = await graphFetch('/users/' + encodeURIComponent(email) + '?$select=id');
    if (u && u.id) { userIdCache[email] = u.id; return u.id; }
  } catch(e2) { console.warn('Graph user lookup failed', email, e2.message); }
  return null;
}

async function namesToSpIds(names) {
  var ids = [];
  for (var i = 0; i < names.length; i++) {
    var n = names[i].trim().toLowerCase();
    var email = USER_MAP[n] || (n.includes('@') ? n : null);
    if (!email) { console.warn('ไม่พบ email สำหรับ:', n); continue; }
    var id = await resolveUserId(email);
    if (id) ids.push(id);
  }
  return ids;
}

function spIdsToNames(raw) {
  // raw อาจเป็น array ของ {LookupValue, LookupId} หรือ string
  var emailToNick = {};
  Object.keys(USER_MAP).forEach(function(k){ emailToNick[USER_MAP[k].toLowerCase()] = k; });
  if (!raw) return [];
  if (typeof raw === 'string') {
    return raw.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  }
  if (Array.isArray(raw)) {
    return raw.map(function(x){
      var lv = (x.LookupValue || x.Title || '').toLowerCase();
      // ลอง match email
      var nick = emailToNick[lv];
      return nick || x.LookupValue || x.Title || String(x);
    });
  }
  return [];
}

var msalApp = null;
var spAccessToken = null;
var TASKS = [];
function initMsal() {
  if (typeof msal === 'undefined') { setTimeout(initMsal, 100); return; }
  msalApp = new msal.PublicClientApplication({
    auth: {
      clientId: SP_CONFIG.clientId,
      authority: 'https://login.microsoftonline.com/' + SP_CONFIG.tenantId,
      redirectUri: window.location.href.split('?')[0],
    },
    cache: { cacheLocation: 'localStorage' },
  });
  msalApp.handleRedirectPromise().then(async function() {
    var accounts = msalApp.getAllAccounts();
    if (accounts.length > 0) {
      await ensureAuth();
      loadTasks();
    } else {
      renderAll();
    }
  }).catch(function(e) { console.error(e); renderAll(); });
}

async function waitForMsal() {
  while (!msalApp) await new Promise(function(r) { setTimeout(r, 100); });
}

async function getToken() {
  var accounts = msalApp.getAllAccounts();
  if (accounts.length > 0) {
    try {
      var res = await msalApp.acquireTokenSilent({ scopes: SCOPES, account: accounts[0] });
      return res.accessToken;
    } catch(e) { /* fall through to popup */ }
  }
  var res2 = await msalApp.acquireTokenPopup({ scopes: SCOPES });
  return res2.accessToken;
}

/* ensureAuth — ตรงๆ เหมือน it-tasks ไม่มี spinner ค้าง */
async function ensureAuth() {
  console.log('[1] ensureAuth called, msalApp=', !!msalApp);
  try {
    await waitForMsal();
    console.log('[2] MSAL ready, calling getToken...');
    spAccessToken = await getToken();
    console.log('[3] Token OK');
    var accounts = msalApp.getAllAccounts();
    var user = accounts.length > 0 ? (accounts[0].username || accounts[0].name || '') : '';
    document.getElementById('sp-status-text').textContent = '🟢 Login แล้ว';
    document.getElementById('sp-status-text').style.color = 'var(--green)';

    document.getElementById('btn-logout').style.display = 'inline-block';
    document.getElementById('btn-refresh').style.display = 'inline-block';
    return true;
  } catch(e) {
    console.error('[ERR] ensureAuth failed:', e.errorCode, e.message);
    document.getElementById('sp-status-text').textContent = '❌ ' + (e.errorCode||'') + ' ' + e.message;
    document.getElementById('sp-status-text').style.color = 'var(--red)';

  }
}

async function doLogout() {
  try { await msalApp.logoutPopup(); } catch(e) {}

  document.getElementById('sp-status-text').textContent = '⚪ ยังไม่ได้ Login';

/* ---- Graph API (เหมือน it-tasks) ---- */
async function graphFetch(path, method, body) {
  method = method || 'GET';
  if (!spAccessToken) spAccessToken = await getToken();
  var opts = { method: method, headers: { 'Authorization': 'Bearer ' + spAccessToken, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  var res = await fetch('https://graph.microsoft.com/v1.0' + path, opts);
  if (res.status === 401) {
    spAccessToken = await getToken();
    opts.headers['Authorization'] = 'Bearer ' + spAccessToken;
    res = await fetch('https://graph.microsoft.com/v1.0' + path, opts);
  }
  if (!res.ok) throw new Error('Graph ' + res.status + ': ' + await res.text());
  return res.status === 204 ? null : res.json();
}
var GRAPH_LIST = '/sites/' + SP_CONFIG.siteId + '/lists/' + SP_CONFIG.listId;

function itemToTask(item) {
  var f = item.fields || {}, M = SP_MAP;
  return {
    id: item.id, _spId: item.id,
    title: f[M.title] || '(ไม่มีชื่อ)', project: f[M.project] || '',
    phase: f[M.phase] || '', type: f[M.type] || '',
    status: (f[M.status] || 'todo').toLowerCase(),
    received: f[M.received] ? f[M.received].substring(0,10) : '',
    started: f[M.started] ? f[M.started].substring(0,10) : '',
    completed: f[M.completed] ? f[M.completed].substring(0,10) : '',
    due: f[M.due] ? f[M.due].substring(0,10) : '',
    assignees: spIdsToNames(f[M.assignees]),
    remark: f[M.remark] || ''
  };
}
async function taskToFields(t) {
  var M = SP_MAP, o = {};
  o[M.title]=t.title||'(ไม่มีชื่อ)'; o[M.project]=t.project||''; o[M.phase]=t.phase||'';
  o[M.type]=t.type||''; o[M.status]=t.status||'todo';
  o[M.received]=t.received||null; o[M.started]=t.started||null;
  o[M.completed]=t.completed||null; o[M.due]=t.due||null;
  o[M.remark]=t.remark||'';
  // Person column — ส่งเป็น array ของ ID ตัวเลข
  var ids = await namesToSpIds(t.assignees||[]);
  if (ids.length > 0) {
    // SharePoint Graph Person multi: ใช้ field + 'LookupId' array
    o[M.assignees] = ids;
  }
  return o;
}
async function loadTasks() {
  document.getElementById('sp-status-text').textContent = '⬇ กำลังโหลด...';
  try {
    var data = await graphFetch(GRAPH_LIST + '/items?expand=fields&$top=500');
    TASKS = (data.value || []).map(itemToTask);
    renderAll();
    document.getElementById('sp-status-text').textContent = '🟢 โหลดสำเร็จ ' + TASKS.length + ' งาน';
    document.getElementById('sp-status-text').style.color = 'var(--green)';
  } catch(e) {
    document.getElementById('sp-status-text').textContent = '❌ ' + e.message;
    document.getElementById('sp-status-text').style.color = 'var(--red)';
    console.error(e);
  }
}
async function graphSaveTask(t) {
  var fields = await taskToFields(t);
  if (t._spId) {
    await graphFetch(GRAPH_LIST + '/items/' + t._spId + '/fields', 'PATCH', fields);
  } else {
    var res = await graphFetch(GRAPH_LIST + '/items', 'POST', { fields: fields });
    t._spId = res.id; t.id = res.id;
  }
}
async function graphDeleteTask(t) {
  if (!t._spId) return;
  await graphFetch(GRAPH_LIST + '/items/' + t._spId, 'DELETE');
}

function todayStr(){return new Date().toISOString().slice(0,10);}
function isOverdue(t){return t.due&&t.status!=='done'&&t.due<todayStr();}
function phaseClass(p){return p==='Pre-Construction'?'pill-pre':p==='Post-Construction'?'pill-post':'pill-other';}
var DISPLAY_MAP = {
  'cos_meen':'meen','cos_friend':'friend','cos_auto':'auto','cos_nan':'nan','cos_noon':'noon'
};
function displayName(n){ return DISPLAY_MAP[n] || n; }
function avatars(list){if(!list||!list.length)return '<span style="color:var(--muted)">—</span>';
  return '<span class="assignees">'+list.map(function(n){return '<span class="mini-av" title="'+displayName(n)+'">'+displayName(n).charAt(0).toUpperCase()+'</span>';}).join('')+'</span>';}
function dueBadge(t){if(!t.due)return '—';return isOverdue(t)?'<span class="due-over">'+t.due+'</span>':t.due;}
function taskRow(t){var st=STATUS_MAP[t.status]||STATUS_MAP.todo;
  return '<tr><td><b>'+t.title+'</b>'+(t.remark?'<br><span style="font-size:11px;color:var(--muted)">'+t.remark+'</span>':'')+'</td><td>'+(t.project||'—')+'</td>'

    +'<td>'+(t.type||'—')+'</td><td>'+avatars(t.assignees)+'</td>'
    +'<td><span class="pill '+st.cls+'">'+st.label+'</span></td>'
    +'<td>'+dueBadge(t)+'</td>'
    +'<td><button class="link" onclick="editTask(\''+t.id+'\')">แก้ไข</button></td></tr>';}

function renderNextMonth(scope){var y=document.getElementById('dashYear').value,m=document.getElementById('dashMonth').value;
  var list,heading;

  else{var now=new Date(),start=new Date(now.getFullYear(),now.getMonth()+1,1),end=new Date(now.getFullYear(),now.getMonth()+2,0);
    list=TASKS.filter(function(t){if(!t.due)return false;var x=new Date(t.due);return x>=start&&x<=end;});heading='งานที่ต้องส่งเดือนหน้า';}

function renderWorkload(scope){scope=scope||TASKS;var map={};
  scope.forEach(function(t){t.assignees.forEach(function(a){map[a]=map[a]||{total:0,done:0};map[a].total++;if(t.status==='done')map[a].done++;});});
  var names=Object.keys(map),el=document.getElementById('workload');
  if(!names.length){el.innerHTML='<div class="empty">ยังไม่มีข้อมูล</div>';return;}
  var max=Math.max.apply(null,names.map(function(n){return map[n].total;}));
  el.innerHTML=names.map(function(n){var w=Math.round(map[n].total/max*100);
    return '<div class="bar-row"><div class="name">'+n+'</div><div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div><div class="val">'+map[n].done+'/'+map[n].total+' เสร็จ</div></div>';}).join('');}
function renderDuration(scope){scope=scope||TASKS;var map={};
  scope.forEach(function(t){if(t.started&&t.completed){var d=Math.round((new Date(t.completed)-new Date(t.started))/86400000);map[t.type]=map[t.type]||[];map[t.type].push(d);}});
  var types=Object.keys(map),el=document.getElementById('durationByType');
  if(!types.length){el.innerHTML='<div class="empty">ยังไม่มีงานที่มีทั้งวันเริ่มและวันเสร็จ</div>';return;}
  var avgs=types.map(function(ty){return{ty:ty,avg:Math.round(map[ty].reduce(function(a,b){return a+b;},0)/map[ty].length)};});
  var max=Math.max.apply(null,avgs.map(function(a){return a.avg;}))||1;
  el.innerHTML=avgs.map(function(a){var w=Math.round(a.avg/max*100);
    return '<div class="bar-row"><div class="name" style="width:190px">'+a.ty+'</div><div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:var(--blue)"></div></div><div class="val">'+a.avg+' วัน</div></div>';}).join('');}

function getFiltered(prefix){
  var pre=prefix||'';
  var q=(document.getElementById(pre+'filterSearch')||document.getElementById('filterSearch')).value.toLowerCase();
  var fph=document.getElementById(pre+'FilterPhase')||document.getElementById('filterPhase');
  var fph_v=fph?fph.value:'';
  var ft_el=document.getElementById(pre+'FilterType')||document.getElementById('filterType');
  var ft_v=ft_el?ft_el.value:'';
  var fs_el=document.getElementById(pre+'FilterStatus')||document.getElementById('filterStatus');
  var fs_v=fs_el?fs_el.value:'';
  var fa_el=document.getElementById(pre+'FilterAssignee')||document.getElementById('filterAssignee');
  var fa_v=fa_el?fa_el.value:'';
  var fp_el=document.getElementById('filterProject');
  var fp_v=fp_el?fp_el.value:'';
  return TASKS.filter(function(t){
    if(q&&!t.title.toLowerCase().includes(q))return false;
    if(fp_v&&t.project!==fp_v)return false;
    if(fph_v&&t.phase!==fph_v)return false;
    if(ft_v&&t.type!==ft_v)return false;
    if(fs_v&&t.status!==fs_v)return false;
    if(fa_v&&!t.assignees.includes(fa_v))return false;
    return true;
  });
}

  catch(e){document.getElementById('saveError').textContent='ลบไม่สำเร็จ: '+e.message;}}

renderAll();   // แสดง UI ก่อน (ว่างๆ) เหมือน it-tasks
initMsal();    // เริ่ม MSAL รอ script โหลดเอง
</script>
